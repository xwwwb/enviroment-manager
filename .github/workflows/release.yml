name: Release macOS

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - architecture: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: EnvironmentManager ${{ github.ref_name }}
          releaseBody: |
            macOS 安装包，包含 Apple Silicon (arm64) 和 Intel (x86_64) 版本。

            此版本使用临时签名，未经过 Apple 公证。首次打开时可能需要在“系统设置 → 隐私与安全性”中允许运行。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg

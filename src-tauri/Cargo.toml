[package]
name = "environment-manager"
version = "1.0.1"
description = "Manage Bash and Zsh environments"
authors = ["xwwwb"]
edition = "2021"

[lib]
name = "environment_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
